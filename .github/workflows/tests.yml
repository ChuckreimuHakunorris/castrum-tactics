name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore CastrumTactics.sln
      - name: Build solution
        run: dotnet build CastrumTactics.sln --no-restore
      - name: Run xUnit tests
        env:
          VSTEST_ARTIFACTS_BASE_DIRECTORY: ${{ runner.temp }}
        run: dotnet test CastrumTactics.sln --no-build
